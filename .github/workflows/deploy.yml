name: Test and deploy

# Tests, then publishes to GitHub Pages stamped v1.<number of commits>.
# The steps live in csciuto/app-template/.github/workflows/app.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    uses: csciuto/app-template/.github/workflows/app.yml@v3
    with:
      site: docs
      stamp: index.html
      # apt (--with-deps) sometimes hangs on a slow mirror: four minutes, then the browser alone
      python-test: (timeout 240 python -m playwright install --with-deps chromium || python -m playwright install chromium) && python -m pytest -q
      browser-test: ''
