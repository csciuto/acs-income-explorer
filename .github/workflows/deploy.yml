name: Deploy to GitHub Pages

# Every push to main publishes docs/ with an auto-incremented version (v1.<number of commits>)
# written to docs/version.json, which the footer shows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stamp version
        run: |
          VERSION="v1.$(git rev-list --count HEAD)"
          printf '{"version":"%s","commit":"%s","date":"%s"}\n' "$VERSION" "$(git rev-parse --short HEAD)" "$(git log -1 --format=%cs)" > docs/version.json
          cat docs/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
